[package]
name = "unofficial-zolo"
version = "1.0.0"
description = "Unofficial community-maintained multi-account Zalo Web manager for Linux"
authors = ["Community Contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/your-username/unofficial-zolo"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri framework
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
uuid = { version = "1", features = ["v4"] }
url = "2"
thiserror = "1"

[features]
# This feature is used for production builds or when a dev server is not specified
custom-protocol = ["tauri/custom-protocol"]
